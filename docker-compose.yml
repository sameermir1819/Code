services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: coaching-institute-erp:latest
    container_name: coaching_erp_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    volumes:
      - private_uploads:/app/.data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  private_uploads:
